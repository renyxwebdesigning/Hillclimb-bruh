name: Browser version

# Builds the browser version with pygbag and publishes it on GitHub Pages
# (branch gh-pages) every time main changes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build web version
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m pip install pygbag==0.9.3
          mkdir web-src
          cp *.py web-src/
          cp -r assets web-src/
          if ! PYTHONUNBUFFERED=1 python -u -m pygbag --build --title "Hill Rider" --template web/loader.tmpl web-src > build.log 2>&1; then
            echo "::error::$(grep -v ' : assets/' build.log | tail -25 | sed 's/%/%25/g' | tr '\n' '~' | sed 's/~/%0A/g')"
            exit 1
          fi
          tail -5 build.log
          cp web/manifest.webmanifest web/sw.js web/icon-*.png web/favicon.png web-src/build/web/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web-src/build/web
          force_orphan: true
